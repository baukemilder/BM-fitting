: column; gap: 10px\">\n    <div style=\"display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; background: #1C1C1E\">\n      <span style=\"width: 42px; height: 42px; border-radius: 13px; background: #30D158; color: #00210A; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8h3l2-3h6l2 3h3v11H4z\"><\/path><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\/circle><\/svg><\/span>\n      <span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 16px; font-weight: 700\">Scan jouw lichaam<\/span><span style=\"font-size: 13px; color: #A1A1A6\">Maak een 3D-model van jezelf<\/span><\/span>\n    <\/div>\n    <div style=\"display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; background: #1C1C1E\">\n      <span style=\"width: 42px; height: 42px; border-radius: 13px; background: #4DA8FF; color: #10131A; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 4l-5 3 2 4 3-1v10h8V10l3 1 2-4-5-3c-1 1.5-2.2 2-4 2s-3-.5-4-2z\"><\/path><\/svg><\/span>\n      <span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 16px; font-weight: 700\">Pas kleding virtueel<\/span><span style=\"font-size: 13px; color: #A1A1A6\">Scan het label en zie het direct op jou<\/span><\/span>\n    <\/div>\n    <div style=\"display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 22px; background: #1C1C1E\">\n      <span style=\"width: 42px; height: 42px; border-radius: 13px; background: #FF7EB6; color: #10131A; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 7h16M4 12h16M4 17h10\"><\/path><\/svg><\/span>\n      <span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 16px; font-weight: 700\">Zie elke maat op jou<\/span><span style=\"font-size: 13px; color: #A1A1A6\">Kies zelf wat je mooi vindt<\/span><\/span>\n    <\/div>\n  <\/div>\n  <div style=\"position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; flex-direction: column; gap: 10px\">\n    <a href=\"start-2-uitleg.dc.html\" style=\"height: 56px; border-radius: 28px; background: #30D158; color: #00210A; font-size: 17px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center\">Aan de slag<\/a>\n    <a href=\"start-8-inloggen.dc.html\" style=\"height: 54px; border-radius: 27px; background: #1C1C1E; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center\">Ik heb al een account<\/a>\n  <\/div>\n<\/div>", "js": "\nclass Component extends DCLogic {\n  renderVals() {\n    return {};\n  }\n}\n"}, "start-2-uitleg": {"tpl": "<div style=\"width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; isolation: isolate\"><div aria-hidden=\"true\" style=\"position: absolute; z-index: -1; left: -80px; top: -120px; width: 320px; height: 320px; border-radius: 50%; background: #9B7BFF; filter: blur(110px); opacity: 0.33; pointer-events: none\"><\/div><div aria-hidden=\"true\" style=\"position: absolute; z-index: -1; right: -120px; top: 40px; width: 300px; height: 300px; border-radius: 50%; background: #4DA8FF; filter: blur(110px); opacity: 0.3; pointer-events: none\"><\/div>\n  <a href=\"start-3-voorwaarden.dc.html\" style=\"position: absolute; right: 20px; top: 58px; height: 36px; padding: 0 14px; border-radius: 18px; background: #1C1C1E; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center\">Overslaan<\/a>\n  <div style=\"position: absolute; left: 24px; right: 24px; top: 170px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center\">\n    <span style=\"width: 200px; height: 200px; border-radius: 60px; background: {{color}}; color: #10131A; display: flex; align-items: center; justify-content: center\">\n      <svg width=\"92\" height=\"92\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"{{d1}}\"><\/path><path d=\"{{d2}}\"><\/path><\/svg>\n    <\/span>\n    <h1 style=\"margin: 12px 0 0; font-size: 36px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.05\">{{title}}<br><span style=\"color: {{color}}\">{{accentWord}}<\/span><\/h1>\n    <p style=\"margin: 0; font-size: 17px; line-height: 1.5; color: #A1A1A6; max-width: 300px\">{{text}}<\/p>\n  <\/div>\n  <div style=\"position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; flex-direction: column; gap: 18px\">\n    <div aria-label=\"{{stepLabel}}\" style=\"display: flex; justify-content: center; gap: 8px\">\n      <sc-for list=\"{{dots}}\" as=\"dot\" hint-placeholder-count=\"3\">\n        <span style=\"width: {{dot.w}}px; height: 8px; border-radius: 4px; background: {{dot.bg}}; transition: all 0.3s\"><\/span>\n      <\/sc-for>\n    <\/div>\n    <sc-if value=\"{{notLast}}\" hint-placeholder-val=\"{{ true }}\">\n      <button onClick=\"{{next}}\" style=\"height: 56px; border-radius: 28px; border: 0; background: #30D158; color: #00210A; font-size: 17px; font-weight: 800\">Volgende<\/button>\n    <\/sc-if>\n    <sc-if value=\"{{isLast}}\" hint-placeholder-val=\"{{ false }}\">\n      <a href=\"start-3-voorwaarden.dc.html\" style=\"height: 56p   toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), isBad ? 2600 : 1800);
}

const sheetEl = document.getElementById('sheet'), scrim = document.getElementById('scrim');
const ICON = {
  scan: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>',
  link: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4DA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>',
  own: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC83D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4l-5 3 2 4 3-1v10h8V10l3 1 2-4-5-3c-1 1.5-2.2 2-4 2s-3-.5-4-2z"></path></svg>',
  bag: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF7EB6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>'
};
const SHEETS = {
  kast: '<div class="grab"></div><h2>Toevoegen aan je kast</h2><p>Kleding die je al hebt voeg je toe zonder te kopen. Wat je nog niet bezit krijgt een <b style="color:#fff">＋</b> in je kast.</p>' +
    '<button class="opt" data-go="scan-1">' + ICON.scan + 'Scan het label</button>' +
    '<button class="opt" data-sheet="link">' + ICON.link + 'Plak een link</button>' +
    '<button class="opt" data-go="winkel-ab">' + ICON.bag + 'Kies uit een winkel</button>' +
    '<button class="opt" data-act="openOwn">' + ICON.own + 'Eigen kledingstuk toevoegen</button>' +
    '<button class="cancel" data-close>Annuleer</button>',
  link: '<div class="grab"></div><h2>Link plakken</h2><p>Plak de link van een product uit elke webshop.</p>' +
    '<input type="url" aria-label="Productlink" placeholder="https://www.mango.com/…" data-mem="link" data-enter="linkSearch" autocomplete="off">' +
    '<button class="go" data-act="linkSearch">Zoek product</button><button class="cancel" data-close>Annuleer</button>'
};
function openSheet(k) { sheetEl.innerHTML = SHEETS[k]; scrim.classList.add('on'); sheetEl.classList.add('on'); }
function closeSheet() { scrim.classList.remove('on'); sheetEl.classList.remove('on'); }
scrim.addEventListener('click', closeSheet);

function handle(e) {
  const ac = e.target.closest('[data-act]');
  if (ac) { e.preventDefault(); const pr = ac.dataset.act.split(':'); if (ACT[pr[0]]) ACT[pr[0]].apply(null, [ac].concat(pr.slice(1))); return; }
  const t = e.target.closest('[data-go],[data-back],[data-toast],[data-sheet],[data-close],[data-tab],a[href]');
  if (!t) return;
  if (t.matches('a[target="_blank"]')) return;
  e.preventDefault();
  if (t.hasAttribute('data-close')) { closeSheet(); return; }
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  if (t.dataset.toast) toast(t.dataset.toast);
  if (t.dataset.goAfter) { const n = t.dataset.goAfter; setTimeout(() => go(n), 900); return; }
  if (t.dataset.sheet) { openSheet(t.dataset.sheet); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.hasAttribute('data-back')) { back(); return; }
  if (t.dataset.toast) return;
  const href = t.getAttribute('href') || '';
  const m = /([\w-]+)\.dc\.html$/.exec(href);
  if (m) go(m[1]);
}
document.getElementById('frame').addEventListener('click', handle);
document.getElementById('restart').addEventListener('click', () => { resetAll(); stack = []; Object.keys(logics).forEach((k) => delete logics[k]); document.body.classList.remove('light'); current = START; closeSheet(); show(true); });
document.getElementById('skip').addEventListener('click', () => { APP.user.loggedIn = true; save(); stack = []; current = 'home-h'; closeSheet(); show(true); });

function fit() {
  const wrap = document.getElementById('wrap'), frame = document.getElementById('frame');
  const mobile = window.innerWidth < 500;
  document.body.classList.toggle('mobile', mobile);
  let s, h = 844;
  if (mobile) { s = window.innerWidth / 390; h = Math.max(600, window.innerHeight / s); }
  else { s = Math.min(1, (window.innerHeight - 52 - 36) / 870, (window.innerWidth - 40) / 416); }
  frame.style.height = h + 'px';
  frame.style.transform = 'scale(' + s + ')';
  wrap.style.width = 390 * s + 'px'; wrap.style.height = h * s + 'px';
  wrap.style.marginTop = mobile ? '0' : '14px';
}
window.addEventListener('resize', fit); fit();
show(true);
</script>
